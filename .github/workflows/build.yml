name: Build Fabric Mod

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 1. Unzip and Flatten Structure (Fixes ClassNotFoundException)
      - name: Extract & Flatten Code Base
        run: |
          unzip -o *.zip || true
          find . -mindepth 2 -type f \( -name "build.gradle" -o -name "settings.gradle" \) -execdir cp -r ./* $GITHUB_WORKSPACE/ \; || true

      # 2. Update Target Versions for 1.21.11
      - name: Update Target Versions
        run: |
          sed -i 's/1.20.1/1.21.11/g' build.gradle || true
          sed -i 's/0.83.0+1.20.1/0.104.0+1.21.11/g' build.gradle || true

      # 3. Setup JDK 21
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # 4. Download and Force Official Gradle 8.8 Standalone Executable
      - name: Setup Dedicated Gradle 8.8
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.8-bin.zip
          unzip -q gradle-8.8-bin.zip
          echo "$GITHUB_WORKSPACE/gradle-8.8/bin" >> $GITHUB_PATH

      # 5. Build Project with System Gradle 8.8
      - name: Build Mod
        run: gradle build --no-daemon

      # 6. Upload Final Output (.jar)
      - name: Upload Mod Artifact
        uses: actions/upload-artifact@v4
        with:
          name: target-detector-mod
          path: build/libs/*.jar
          
