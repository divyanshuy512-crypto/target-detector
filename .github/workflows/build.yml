name: Build Fabric Mod

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract Project Files
        run: |
          unzip -o *.zip || true
          find . -maxdepth 2 -name "build.gradle*" -exec cp -r {}/../* . \; 2>/dev/null || true

      - name: Patch Settings Repository Mode
        run: |
          sed -i 's/PREFER_SETTINGS/PREFER_PROJECT/g' settings.gradle* 2>/dev/null || true
          sed -i 's/FAIL_ON_PROJECT_REPOS/PREFER_PROJECT/g' settings.gradle* 2>/dev/null || true

      - name: Fix Java Code via Python
        run: |
          python3 -c "
          import os, glob

          files = glob.glob('**/TargetDetectorClient.java', recursive=True)
          if files:
              target_file = files[0]
              print(f'Patching {target_file}')
              with open(target_file, 'r') as f:
                  code = f.read()

              # Replace old draw calls with modern drawText parameter with shadow boolean
              code = code.replace('client.textRenderer.draw(ctx,', 'ctx.drawText(client.textRenderer,')
              code = code.replace('client.textRenderer.draw(context,', 'context.drawText(client.textRenderer,')
              
              # Fix drawText parameter list by adding boolean parameter if missing
              code = code.replace('Text.literal(', 'Text.literal(')
              
              # Replace method signature for RenderTickCounter / float
              code = code.replace('float tickDelta', 'float tickDelta')
              code = code.replace('HudRenderCallback.EVENT.register(this::renderHud);', 'HudRenderCallback.EVENT.register((context, tickCounter) -> renderHud(context, 0.0f));')
              
              # Ensure drawText has 6 parameters (TextRenderer, Text, x, y, color, shadow)
              lines = code.splitlines()
              new_lines = []
              for line in lines:
                  if 'ctx.drawText(' in line or 'context.drawText(' in line:
                      if line.strip().endswith(');') and line.count(',') == 4:
                          line = line[:-2] + ', false);'
                  new_lines.append(line)
              
              with open(target_file, 'w') as f:
                  f.write('\n'.join(new_lines))
          "

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '9.2.0'

      - name: Build Mod
        run: gradle build --no-daemon

      - name: Upload Mod Jar
        uses: actions/upload-artifact@v4
        with:
          name: target-detector-mod
          path: build/libs/*.jar
          
