name: Build Fabric Mod

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract Zip Content
        run: |
          unzip -o *.zip || true

      - name: Update Target Version to 1.21.11
        run: |
          sed -i 's/1.20.1/1.21.11/g' build.gradle || true
          sed -i 's/0.83.0+1.20.1/0.104.0+1.21.11/g' build.gradle || true

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle 8.8
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.8'

      - name: Build with Gradle
        run: gradle build

      - name: Upload Mod Artifact
        uses: actions/upload-artifact@v4
        with:
          name: target-detector-mod
          path: build/libs/*.jar
          
