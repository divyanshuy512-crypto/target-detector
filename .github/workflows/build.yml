name: Build Fabric Mod

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 1. Extract Project Files
      - name: Extract Project Files
        run: |
          unzip -o *.zip || true
          find . -maxdepth 2 -name "build.gradle*" -exec cp -r {}/../* . \; 2>/dev/null || true

      # 2. Patch Target Versions to 1.21.11
      - name: Update Target Version to 1.21.11
        run: |
          sed -i 's/1.20.1/1.21.11/g' build.gradle || true
          sed -i 's/0.83.0+1.20.1/0.104.0+1.21.11/g' build.gradle || true

      # 3. Patch Settings Repository Mode
      - name: Patch Settings Repository Mode
        run: |
          sed -i 's/PREFER_SETTINGS/PREFER_PROJECT/g' settings.gradle* 2>/dev/null || true
          sed -i 's/FAIL_ON_PROJECT_REPOS/PREFER_PROJECT/g' settings.gradle* 2>/dev/null || true

      # 4. Overwrite TargetDetectorClient File with Fixed KeyBinding Category
      - name: Overwrite TargetDetectorClient File
        run: |
          python3 -c "
          import os, glob

          content = '''package com.example.targetdetector;

          import net.fabricmc.api.ClientModInitializer;
          import net.fabricmc.fabric.api.client.event.lifecycle.v1.ClientTickEvents;
          import net.fabricmc.fabric.api.client.keybinding.v1.KeyBindingHelper;
          import net.minecraft.client.MinecraftClient;
          import net.minecraft.client.option.KeyBinding;
          import net.minecraft.client.util.InputUtil;
          import net.minecraft.entity.Entity;
          import net.minecraft.entity.LivingEntity;
          import net.minecraft.text.Text;
          import net.minecraft.util.Formatting;
          import net.minecraft.util.Hand;
          import net.minecraft.util.hit.EntityHitResult;
          import net.minecraft.util.hit.HitResult;
          import org.lwjgl.glfw.GLFW;

          public class TargetDetectorClient implements ClientModInitializer {

              private static KeyBinding toggleKey;
              private boolean enabled = false;

              @Override
              public void onInitializeClient() {
                  toggleKey = KeyBindingHelper.registerKeyBinding(new KeyBinding(
                          \"key.targetdetector.toggle\",
                          InputUtil.Type.KEYSYM,
                          GLFW.GLFW_KEY_Z,
                          KeyBinding.MISC_CATEGORY
                  ));

                  ClientTickEvents.END_CLIENT_TICK.register(client -> {
                      if (client.player == null || client.world == null) return;

                      // Check for Key Press Toggle
                      while (toggleKey.wasPressed()) {
                          enabled = !enabled;
                          client.player.sendMessage(
                                  Text.literal(\"Triggerbot: \" + (enabled ? \"ENABLED\" : \"DISABLED\"))
                                          .formatted(enabled ? Formatting.GREEN : Formatting.RED),
                                  true
                          );
                      }

                      // Triggerbot Logic
                      if (enabled && client.interactionManager != null) {
                          HitResult hitResult = client.crosshairTarget;

                          if (hitResult != null && hitResult.getType() == HitResult.Type.ENTITY) {
                              Entity target = ((EntityHitResult) hitResult).getEntity();

                              if (target instanceof LivingEntity && target.isAlive()) {
                                  double distanceSq = client.player.squaredDistanceTo(target);

                                  // 4 Blocks Range (4 * 4 = 16)
                                  if (distanceSq <= 16.0) {
                                      // 1.6 Attack Speed Cooldown Check
                                      if (client.player.getAttackCooldownProgress(0.5f) >= 0.9f) {
                                          client.interactionManager.attackEntity(client.player, target);
                                          client.player.swingHand(Hand.MAIN_HAND);
                                      }
                                  }
                              }
                          }
                      }
                  });
              }
          }
          '''

          files = glob.glob('**/TargetDetectorClient.java', recursive=True)
          if files:
              with open(files[0], 'w') as f:
                  f.write(content)
              print(f'Successfully updated {files[0]}')
          "

      # 5. Java & Gradle Setup
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '9.2.0'

      # 6. Build and Upload
      - name: Build Mod
        run: gradle build --no-daemon

      - name: Upload Mod Jar
        uses: actions/upload-artifact@v4
        with:
          name: target-detector-mod
          path: build/libs/*.jar
