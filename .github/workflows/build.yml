name: Build Fabric Mod

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract Project Files
        run: |
          unzip -o *.zip || true
          find . -maxdepth 2 -name "build.gradle*" -exec cp -r {}/../* . \; 2>/dev/null || true

      - name: Patch Settings Repository Mode
        run: |
          sed -i 's/PREFER_SETTINGS/PREFER_PROJECT/g' settings.gradle* 2>/dev/null || true
          sed -i 's/FAIL_ON_PROJECT_REPOS/PREFER_PROJECT/g' settings.gradle* 2>/dev/null || true

      - name: Fix Java Code via Robust Python Script
        run: |
          python3 -c "
          import os, glob, re

          files = glob.glob('**/TargetDetectorClient.java', recursive=True)
          if files:
              target_file = files[0]
              print(f'Patching {target_file}')
              with open(target_file, 'r') as f:
                  code = f.read()

              # Convert legacy client text renderer calls
              code = re.sub(r'client\.textRenderer\.draw\s*\(', 'ctx.drawText(client.textRenderer, ', code)
              
              # Fix drawText parameter signatures (ensure 6 parameters: renderer, text, x, y, color, shadow)
              # Match drawText(...) calls missing the boolean parameter
              def fix_draw_text(match):
                  call_content = match.group(1)
                  # If missing shadow parameter (5 args total), append shadow boolean ', false'
                  parts = call_content.split(',')
                  if len(parts) == 5:
                      return f'drawText({call_content}, false)'
                  return match.group(0)

              code = re.sub(r'drawText\(([^;\)]+)\)', fix_draw_text, code)
              
              # Fix HudRenderCallback signature mismatch for newer Fabric Loom
              code = code.replace('HudRenderCallback.EVENT.register(this::renderHud);', 'HudRenderCallback.EVENT.register((context, tickCounter) -> renderHud(context, 0.0f));')

              with open(target_file, 'w') as f:
                  f.write(code)
          "

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '9.2.0'

      - name: Build Mod
        run: gradle build --no-daemon

      - name: Upload Mod Jar
        uses: actions/upload-artifact@v4
        with:
          name: target-detector-mod
          path: build/libs/*.jar

